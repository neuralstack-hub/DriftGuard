name: Drift-Triggered Retraining & Image Build

on:
  repository_dispatch:
    types: [drift-detected]
  workflow_dispatch:

jobs:
  retrain-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Download UCI Beijing PM2.5 dataset
        run: python scripts/download_dataset.py
      - name: Bootstrap v1 if needed and run candidate retraining
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from backend.app.dependencies import pipeline_service
          pipeline_service.bootstrap_v1()
          outcome = pipeline_service.trigger_retraining(trigger_reason='github_actions_dispatch')
          print('Decision:', outcome['decision'])
          print('Candidate metrics:', outcome['candidate_metrics'])
          "
      - name: Build Backend Docker Image
        run: docker build -f backend/Dockerfile -t driftguard-backend:latest .
      - name: Deployment Note
        run: |
          echo "Docker image built successfully."
          echo "Note: Remote deployment requires configuring a registry push (GHCR/DockerHub) and target host/orchestrator."
