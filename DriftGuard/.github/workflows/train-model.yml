name: Train Initial Model v1

on:
  workflow_dispatch:

jobs:
  train-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Download UCI Beijing PM2.5 dataset
        run: python scripts/download_dataset.py
      - name: Train and evaluate Model v1
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from backend.app.dependencies import get_active_context
          pipeline_service = get_active_context()[-1]
          res = pipeline_service.bootstrap_v1()
          print(res)
          "
      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: driftguard-model-v1
          path: |
            artifacts/models/
            artifacts/projects/*/models/
          if-no-files-found: error
