name: Train Initial Model v1

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: DriftGuard

jobs:
  train-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: DriftGuard/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Download UCI Beijing PM2.5 dataset
        run: python scripts/download_dataset.py
      - name: Train and evaluate Model v1 (isolated workspace)
        run: python scripts/ci_retrain.py --out-dir ci-output
      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: driftguard-model-v1
          path: DriftGuard/ci-output/
          if-no-files-found: error
